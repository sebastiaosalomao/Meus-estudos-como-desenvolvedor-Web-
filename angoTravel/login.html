<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/login.css">
    <title>AngoTravels | Login</title>
</head>
<body>
    <main class="container-login">
        <form class="formulario-login">
            <div class="header">
                <h1>AngoTravels</h1>
                <p>O seu site perfeito para a sua viagem.</p>
            </div>
            <div class="container-inputs">
                <div class="label-input">
                    <label for="iemail">E-mail</label>
                    <input type="email" name="email" id="iemail" autocomplete="off">
                </div>
                <div class="label-input">
                    <label for="isenha">Senha</label>
                    <input type="password" name="senha" id="isenha">
                </div>
                <div class="check-recuperar">
                    <div>
                        <label for="ilembra">Lembra-me</label>
                        <input type="checkbox" name="lembra" id="ilembra">
                    </div>
                    <a href="">Esqueci a senha</a>
                </div>

            </div>
            <input type="submit" class="btn-login" value="Acessar">
        </form>
    </main>
</body>
</html>
